name: CI – d3-auth-service

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Compilar proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Dar permisos a Maven Wrapper
        run: chmod +x ./mvnw
      - name: Compilar proyecto
        run: ./mvnw compile -B
      - name: Compilar clases de test
        run: ./mvnw test-compile -B

  test:
    name: Ejecutar tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Dar permisos a Maven Wrapper
        run: chmod +x ./mvnw
      - name: Ejecutar tests
        run: ./mvnw test -B
        env:
          KEYCLOAK_CLIENT_SECRET: test-secret
          KC_ADMIN_USER: admin
          KC_ADMIN_PASSWORD: admin
      - name: Publicar reporte de tests
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: true
          require_tests: true
      - name: Subir artefactos de reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Ejecutar análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw sonar:sonar -Dsonar.projectKey=daniel-gomez-cano_d3-auth-service -Dsonar.organization=daniel-gomez-cano

  docker:
    name: Construir y publicar imagen Docker
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Dar permisos a Maven Wrapper
        run: chmod +x ./mvnw
      - name: Generar JAR
        run: ./mvnw package -DskipTests -B
        env:
          KEYCLOAK_CLIENT_SECRET: test-secret
          KC_ADMIN_USER: admin
          KC_ADMIN_PASSWORD: admin
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/d3-auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

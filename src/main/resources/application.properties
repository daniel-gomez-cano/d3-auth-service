spring.application.name=Proyecto_Desarrollo3

# =========================
# SECURITY (KEYCLOAK)
# =========================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs


# Puerto del backend
server.port=8081


management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# =========================
# BASE DE DATOS (PostgreSQL)
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# =========================
# H2 CONSOLE
# =========================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# =========================
# KEYCLOAK AUTH (LOGIN)
# =========================
keycloak.token-url=${KEYCLOAK_TOKEN_URL:${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/viva-eventos}/protocol/openid-connect/token}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

# =========================
# KEYCLOAK AUTH (REGISTER)
# =========================
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL}
keycloak.admin.username=${KC_ADMIN_USER}
keycloak.admin.password=${KC_ADMIN_PASSWORD}
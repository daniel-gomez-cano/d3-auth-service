spring.application.name=Proyecto_Desarrollo3_Test

# JWT: apunta a un issuer falso, el mock lo intercepta
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/viva-eventos

server.port=8081

# H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Keycloak fake (no se usa en tests, pero Spring lo exige declarado)
keycloak.token-url=http://localhost:9999/realms/viva-eventos/protocol/openid-connect/token
keycloak.client-id=spring-boot-client
keycloak.client-secret=test-secret
keycloak.admin.server-url=http://localhost:9999
keycloak.admin.username=admin
keycloak.admin.password=admin